<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าหลัก</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans Thai', sans-serif;
    background: #F4F7FC;
    color: #1B2430;
    display: flex;
  }
 
  h1, h2, h3 { font-family: 'Kanit', sans-serif; margin: 0; }
 
  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #E3E8F0;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    height: 100vh;
    position: sticky;
    top: 0;
  }
 
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 24px;
    margin-bottom: 16px;
    border-bottom: 1px solid #EEF2F8;
  }
 
  .brand .logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2F6FED, #14A38A);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
 
  .brand .logo svg { width: 18px; height: 18px; }
 
  .brand span { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; color: #1B2430; }
 
  nav.nav-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
 
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: #4B5768;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
  }
 
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
 
  .nav-item:hover { background: #F0F5FF; color: #2F6FED; }
 
  .nav-item.active {
    background: #2F6FED;
    color: #fff;
  }
 
  .nav-logout {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: #8A5A5A;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-top: 1px solid #EEF2F8;
    margin-top: 8px;
    padding-top: 16px;
  }
 
  .nav-logout svg { width: 18px; height: 18px; }
  .nav-logout:hover { color: #D64545; }
 
  /* ---------- Main ---------- */
  main {
    flex: 1;
    padding: 28px 36px 48px;
    max-width: 1100px;
  }
 
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
 
  .topbar h2 { font-size: 22px; color: #1B2430; }
  .topbar .sub { margin: 4px 0 0; font-size: 14px; color: #6B7686; }
 
  .topbar-right { display: flex; align-items: center; gap: 18px; }
 
  .bell-wrap { position: relative; cursor: pointer; color: #4B5768; }
  .bell-wrap svg { width: 22px; height: 22px; }
  .bell-dot {
    position: absolute; top: -3px; right: -3px;
    width: 16px; height: 16px;
    background: #EF4444;
    color: #fff;
    border-radius: 50%;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #F4F7FC;
  }
 
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FBBF24, #F472B6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 14px;
  }
 
  /* ---------- Stat cards ---------- */
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
 
  .stat-card {
    background: #fff;
    border: 1px solid #E3E8F0;
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
 
  .stat-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
 
  .stat-icon svg { width: 20px; height: 20px; color: #fff; }
  .stat-icon.blue { background: #2F6FED; }
  .stat-icon.teal { background: #14A38A; }
 
  .stat-num { font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 700; color: #1B2430; line-height: 1.2; }
  .stat-label { font-size: 13px; color: #6B7686; margin-top: 2px; }
 
  /* ---------- Progress card ---------- */
  .progress-card {
    background: #fff;
    border: 1px solid #E3E8F0;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 24px;
  }
 
  .progress-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
 
  .progress-head h3 { font-size: 15px; color: #1B2430; }
  .progress-head .remain { font-size: 13px; color: #6B7686; }
 
  .progress-track {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: #EEF2F8;
    overflow: hidden;
    margin-bottom: 8px;
  }
 
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #2F6FED, #14A38A);
  }
 
  .progress-nums { font-size: 13px; color: #4B5768; font-weight: 500; }
 
  /* ---------- Recent activities ---------- */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
 
  .section-head h3 { font-size: 16px; color: #1B2430; }
 
  .see-all {
    font-size: 13px;
    color: #2F6FED;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
  }
 
  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
 
  .activity-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid #E3E8F0;
    border-radius: 14px;
    padding: 12px 16px;
  }
 
  .activity-thumb {
    width: 48px; height: 48px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: #EEF2F8;
  }
 
  .activity-info { flex: 1; min-width: 0; }
  .activity-title { font-size: 14px; font-weight: 600; color: #1B2430; margin-bottom: 3px; }
  .activity-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: #6B7686;
  }
  .activity-meta span { display: flex; align-items: center; gap: 4px; }
  .activity-meta svg { width: 13px; height: 13px; }
 
  .status-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-badge.done { background: #E7F7F1; color: #14A38A; }
  .status-badge.pending { background: #FFF4E0; color: #B4790A; }
 
  @media (max-width: 760px) {
    .sidebar { display: none; }
    main { padding: 20px; }
    .stat-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
 
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.5 1.33 9.6 3.55 11.8L12 20.24l8.45-8.44c2.22-2.2 2.09-5.3.19-7.22Z"></path>
        </svg>
      </div>
      <span id="brandName">ชื่อโครงการ</span>
    </div>
 
    <nav class="nav-list">
      <a class="nav-item active" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10h14V10"></path></svg>
        หน้าหลัก
      </a>
      <a class="nav-item" href="browse-activities.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        รับงานอาสา
      </a>
      <a class="nav-item" href="log-hours.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path><path d="M12 8v4l3 2"></path></svg>
        บันทึกชั่วโมง
      </a>
      <a class="nav-item" href="hour-history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"></path><path d="M3.05 13a9 9 0 1 0 .5-4.5L3 8"></path><path d="M12 7v5l3 3"></path></svg>
        ประวัติชั่วโมง
      </a>
      <a class="nav-item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        โปรไฟล์
      </a>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
        ตั้งค่า
      </a>
      <a class="nav-item" id="adminLink" href="admin-review-hours.html" style="display:none; color:#B4790A;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 9 9 10 5.2-1 9-5 9-10V6l-9-4Z"></path></svg>
        แผงควบคุมแอดมิน
      </a>
    </nav>
 
    <div class="nav-logout" onclick="window.location.href='login.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      ออกจากระบบ
    </div>
  </aside>
 
  <main>
    <div class="topbar">
      <div>
        <h2 id="greeting">สวัสดี... 👋</h2>
        <p class="sub">ยินดีต้อนรับกลับมา</p>
      </div>
      <div class="topbar-right">
        <div class="bell-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span class="bell-dot">2</span>
        </div>
        <div class="avatar" id="avatar">--</div>
      </div>
    </div>
 
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path><path d="M12 8v4l3 2"></path></svg>
        </div>
        <div>
          <div class="stat-num" id="statHours">-- <span style="font-size:14px; font-weight:500; color:#6B7686;">ชั่วโมง</span></div>
          <div class="stat-label">ชั่วโมงสะสม</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon teal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="M22 4 12 14.01l-3-3"></path></svg>
        </div>
        <div>
          <div class="stat-num" id="statActivities">-- <span style="font-size:14px; font-weight:500; color:#6B7686;">กิจกรรม</span></div>
          <div class="stat-label">กิจกรรมที่เข้าร่วม</div>
        </div>
      </div>
    </div>
 
    <div class="progress-card">
      <div class="progress-head">
        <h3>ความคืบหน้าชั่วโมงอาสา</h3>
        <span class="remain" id="progressRemain">เหลืออีก -- ชั่วโมง</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="progress-nums" id="progressNums">-- / -- ชั่วโมง</div>
    </div>
 
    <div class="section-head">
      <h3>กิจกรรมล่าสุด</h3>
      <a class="see-all" href="hour-history.html">ดูทั้งหมด</a>
    </div>
 
    <div class="activity-list" id="activityList">
      <p style="color:#A8B4C7; font-size:13px;">กำลังโหลด...</p>
    </div>
  </main>
 
  <script type="module">
    import { auth, db, onAuthStateChanged, signOut, doc, getDoc, collection, query, where, orderBy, getDocs } from './firebase-init.js';
 
    // โหลดชื่อหน่วยงานจากส่วนกลาง (settings/general) มาแสดงในแถบเมนู/หัวข้อ
    (async () => {
      try {
        const s = await getDoc(doc(db, 'settings', 'general'));
        if (s.exists() && s.data().orgName) {
          document.querySelectorAll('#brandName').forEach((el) => { el.textContent = s.data().orgName; });
        }
      } catch (e) { /* ใช้ชื่อค่าเริ่มต้นถ้าโหลดไม่สำเร็จ */ }
    })();
 
    const logoutBtn = document.querySelector('.nav-logout');
    logoutBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });
 
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // ยังไม่ได้ล็อกอิน เด้งกลับไปหน้า login
        window.location.href = 'login.html';
        return;
      }
 
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const userData = userSnap.exists() ? userSnap.data() : { name: user.email, totalHours: 0, targetHours: 60 };
 
      if (userData.role === 'admin') {
        document.getElementById('adminLink').style.display = 'flex';
      }
 
      document.getElementById('greeting').textContent = `สวัสดี, ${userData.name || user.email} 👋`;
      document.getElementById('avatar').textContent = (userData.name || user.email).slice(0, 2);
 
      const totalHours = userData.totalHours || 0;
      const targetHours = userData.targetHours || 60;
      const remain = Math.max(targetHours - totalHours, 0);
      const pct = Math.min((totalHours / targetHours) * 100, 100);
 
      document.getElementById('statHours').innerHTML = `${totalHours} <span style="font-size:14px; font-weight:500; color:#6B7686;">ชั่วโมง</span>`;
      document.getElementById('progressRemain').textContent = `เหลืออีก ${remain} ชั่วโมง`;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressNums').textContent = `${totalHours} / ${targetHours} ชั่วโมง`;
 
      // ดึงรายการชั่วโมงล่าสุดของ user คนนี้ (จาก collection "hourLogs")
      const list = document.getElementById('activityList');
      try {
        const q = query(
          collection(db, 'hourLogs'),
          where('userId', '==', user.uid),
          orderBy('createdAt', 'desc')
        );
        const logsSnap = await getDocs(q);
 
        document.getElementById('statActivities').innerHTML = `${logsSnap.size} <span style="font-size:14px; font-weight:500; color:#6B7686;">กิจกรรม</span>`;
 
        if (logsSnap.empty) {
          list.innerHTML = '<p style="color:#A8B4C7; font-size:13px;">ยังไม่มีกิจกรรมที่บันทึกไว้</p>';
          return;
        }
 
        const statusLabel = { pending: ['รอตรวจสอบ', 'pending'], done: ['อนุมัติแล้ว', 'done'], rejected: ['ไม่อนุมัติ', 'rejected'] };
        let html = '';
        let count = 0;
        logsSnap.forEach((docSnap) => {
          if (count >= 3) return; // แสดงแค่ 3 รายการล่าสุด
          const d = docSnap.data();
          const [label, cls] = statusLabel[d.status] || ['รอตรวจสอบ', 'pending'];
          html += `
            <div class="activity-row">
              <div class="activity-thumb" style="display:flex;align-items:center;justify-content:center;background:#EEF2F8;color:#8A99B3;font-size:11px;">รูป</div>
              <div class="activity-info">
                <div class="activity-title">${d.activityName || '-'}</div>
                <div class="activity-meta"><span>${d.hours || 0} ชม.</span></div>
              </div>
              <span class="status-badge ${cls}">${label}</span>
            </div>`;
          count++;
        });
        list.innerHTML = html;
      } catch (err) {
        list.innerHTML = '<p style="color:#D64545; font-size:13px;">โหลดข้อมูลไม่สำเร็จ</p>';
        console.error(err);
      }
    });
  </script>
 
</body>
</html>
