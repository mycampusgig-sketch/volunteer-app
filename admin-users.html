<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการผู้ใช้</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans Thai', sans-serif;
    background: #F4F7FC;
    color: #1B2430;
    display: flex;
  }
 
  h1, h2, h3 { font-family: 'Kanit', sans-serif; margin: 0; }
 
  /* ---------- Admin sidebar ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #182238;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 24px; margin-bottom: 16px;
    border-bottom: 1px solid #2A3652;
  }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #2F6FED, #14A38A);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand .logo svg { width: 18px; height: 18px; }
  .brand span { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; color: #fff; }
  .brand .role-tag { font-size: 11px; color: #8AA0C8; margin-top: 2px; display: block; }
 
  nav.nav-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #A9B6D0; font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: #22304D; color: #fff; }
  .nav-item.active { background: #2F6FED; color: #fff; }
 
  .nav-logout {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #C88; font-size: 14px; font-weight: 500; cursor: pointer;
    border-top: 1px solid #2A3652; margin-top: 8px; padding-top: 16px;
  }
  .nav-logout svg { width: 18px; height: 18px; }
  .nav-logout:hover { color: #F08080; }
 
  /* ---------- Main ---------- */
  main { flex: 1; padding: 28px 36px 48px; max-width: 1000px; }
 
  .topbar h2 { font-size: 22px; color: #1B2430; margin-bottom: 20px; }
 
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid #E3E8F0; border-radius: 12px;
    padding: 0 14px; margin-bottom: 18px; max-width: 360px;
  }
  .search-box svg { width: 18px; height: 18px; color: #8A99B3; flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    padding: 11px 0; font-size: 14px; font-family: inherit; color: #1B2430;
  }
 
  .table-card {
    background: #fff; border: 1px solid #E3E8F0; border-radius: 16px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12.5px; font-weight: 600; color: #6B7686;
    padding: 14px 18px; background: #F8FAFD; border-bottom: 1px solid #E3E8F0;
  }
  tbody td {
    padding: 14px 18px; font-size: 13.5px; color: #1B2430;
    border-bottom: 1px solid #EEF2F8; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
 
  .row-name { font-weight: 600; }
  .row-email { font-size: 12px; color: #6B7686; }
 
  .role-badge {
    font-size: 12px; font-weight: 600; padding: 5px 12px;
    border-radius: 999px; white-space: nowrap; display: inline-block;
  }
  .role-badge.admin { background: #FFF4E0; color: #B4790A; }
  .role-badge.user { background: #EEF2F8; color: #4B5768; }
 
  .btn-toggle-role {
    background: #fff; border: 1px solid #E3E8F0; border-radius: 8px;
    padding: 6px 12px; font-size: 12.5px; font-weight: 500; color: #2F6FED;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .btn-toggle-role:hover { background: #F0F5FF; }
 
  @media (max-width: 760px) {
    .sidebar { display: none; }
    main { padding: 20px; }
    .table-card { overflow-x: auto; }
    table { min-width: 620px; }
  }
</style>
</head>
<body>
 
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.5 1.33 9.6 3.55 11.8L12 20.24l8.45-8.44c2.22-2.2 2.09-5.3.19-7.22Z"></path>
        </svg>
      </div>
      <div>
        <span id="brandName">ชื่อโครงการ</span>
        <span class="role-tag">แผงควบคุมแอดมิน</span>
      </div>
    </div>
 
    <nav class="nav-list">
      <a class="nav-item" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10h14V10"></path></svg>
        Dashboard
      </a>
      <a class="nav-item active" href="admin-users.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        จัดการผู้ใช้
      </a>
      <a class="nav-item" href="post-activity.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        โพสต์งานอาสา
      </a>
      <a class="nav-item" href="manage-activities.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18M9 16h6"></path></svg>
        จัดการงานอาสา
      </a>
      <a class="nav-item" href="admin-review-hours.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        ตรวจสอบชั่วโมง
      </a>
    </nav>
 
    <div class="nav-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      ออกจากระบบ
    </div>
  </aside>
 
  <main>
    <div class="topbar"><h2>จัดการผู้ใช้</h2></div>
 
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อหรืออีเมล">
    </div>
 
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>ชื่อ</th>
            <th>สิทธิ์</th>
            <th>ชั่วโมงสะสม</th>
            <th>เป้าหมาย</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="5" style="text-align:center; color:#A8B4C7;">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
 
  <script type="module">
    import { auth, db, onAuthStateChanged, signOut, doc, getDoc, updateDoc, collection, getDocs } from './firebase-init.js';
 
    // โหลดชื่อหน่วยงานจากส่วนกลาง (settings/general) มาแสดงในแถบเมนู/หัวข้อ
    (async () => {
      try {
        const s = await getDoc(doc(db, 'settings', 'general'));
        if (s.exists() && s.data().orgName) {
          document.querySelectorAll('#brandName').forEach((el) => { el.textContent = s.data().orgName; });
        }
      } catch (e) { /* ใช้ชื่อค่าเริ่มต้นถ้าโหลดไม่สำเร็จ */ }
    })();
 
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });
 
    let allUsers = [];
    let currentUid = null;
 
    function renderUsers(filterText) {
      const body = document.getElementById('usersBody');
      const term = (filterText || '').trim().toLowerCase();
      const filtered = !term ? allUsers : allUsers.filter(({ data: u }) =>
        (u.name || '').toLowerCase().includes(term) || (u.email || '').toLowerCase().includes(term)
      );
 
      if (!filtered.length) {
        body.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#A8B4C7;">ไม่พบผู้ใช้</td></tr>';
        return;
      }
 
      body.innerHTML = filtered.map(({ id, data: u }) => `
        <tr>
          <td>
            <div class="row-name">${u.name || '-'}</div>
            <div class="row-email">${u.email || ''}</div>
          </td>
          <td><span class="role-badge ${u.role === 'admin' ? 'admin' : 'user'}">${u.role === 'admin' ? 'แอดมิน' : 'ผู้ใช้ทั่วไป'}</span></td>
          <td>${u.totalHours || 0} ชม.</td>
          <td>${u.targetHours || 60} ชม.</td>
          <td>
            ${id === currentUid
              ? '<span style="color:#A8B4C7; font-size:12.5px;">(บัญชีตัวเอง)</span>'
              : `<button class="btn-toggle-role" data-id="${id}" data-role="${u.role || 'user'}">
                  ${u.role === 'admin' ? 'ลดสิทธิ์เป็นผู้ใช้ทั่วไป' : 'ตั้งเป็นแอดมิน'}
                 </button>`
            }
          </td>
        </tr>`).join('');
 
      body.querySelectorAll('.btn-toggle-role').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const uid = btn.dataset.id;
          const newRole = btn.dataset.role === 'admin' ? 'user' : 'admin';
          if (!confirm(`ยืนยันเปลี่ยนสิทธิ์เป็น "${newRole === 'admin' ? 'แอดมิน' : 'ผู้ใช้ทั่วไป'}"?`)) return;
          btn.disabled = true;
          try {
            await updateDoc(doc(db, 'users', uid), { role: newRole });
            const idx = allUsers.findIndex((u) => u.id === uid);
            if (idx !== -1) allUsers[idx].data.role = newRole;
            renderUsers(document.getElementById('searchInput').value);
          } catch (err) {
            alert('เปลี่ยนสิทธิ์ไม่สำเร็จ: ' + err.message);
            btn.disabled = false;
          }
        });
      });
    }
 
    document.getElementById('searchInput').addEventListener('input', (e) => renderUsers(e.target.value));
 
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUid = user.uid;
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const role = userSnap.exists() ? userSnap.data().role : 'user';
      if (role !== 'admin') {
        alert('หน้านี้สำหรับแอดมินเท่านั้น');
        window.location.href = 'dashboard.html';
        return;
      }
 
      try {
        const snap = await getDocs(collection(db, 'users'));
        allUsers = snap.docs.map((d) => ({ id: d.id, data: d.data() }));
        renderUsers('');
      } catch (err) {
        document.getElementById('usersBody').innerHTML =
          '<tr><td colspan="5" style="text-align:center; color:#D64545;">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        console.error(err);
      }
    });
  </script>
 
</body>
</html>
