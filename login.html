<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Noto Sans Thai', sans-serif;
    background: linear-gradient(180deg, #EAF3FF 0%, #F7FBFF 60%);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid #E3E8F0;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(20,40,80,0.08);
    overflow: hidden;
  }
  .card-inner { padding: 40px 32px 32px; }
  .logo {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2F6FED, #14A38A);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .logo svg { width: 26px; height: 26px; }
  h1 {
    font-family: 'Kanit', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #1B2430;
    text-align: center;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: #6B7686;
    font-size: 14px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #1B2430;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  .input-wrap { position: relative; }
  .input-wrap svg.icon-left {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #6B7686;
  }
  .input-wrap input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    border: 1px solid #E3E8F0;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    color: #1B2430;
  }
  .input-wrap input:focus {
    outline: none;
    border-color: #2F6FED;
    box-shadow: 0 0 0 3px rgba(47,111,237,0.15);
  }
  .input-wrap input.pw { padding-right: 38px; }
  .toggle-eye {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: #6B7686;
  }
  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; margin-bottom: 18px;
  }
  .remember { display: flex; align-items: center; gap: 8px; color: #1B2430; cursor: pointer; }
  .forgot { background: none; border: none; color: #2F6FED; font-weight: 500; font-size: 14px; cursor: pointer; }
  .forgot:hover { text-decoration: underline; }
  .btn-primary {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 12px;
    background: #2F6FED;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary:hover { background: #1F4FC4; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0;
    color: #6B7686; font-size: 13px;
  }
  .divider .line { flex: 1; height: 1px; background: #E3E8F0; }
  .btn-secondary {
    width: 100%;
    padding: 11px;
    border: 1px solid #E3E8F0;
    border-radius: 12px;
    background: #fff;
    color: #1B2430;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #F0F5FF; }
  .notice {
    font-size: 13px;
    background: #FFF7E8;
    color: #8A5A00;
    border: 1px solid #FBE6BD;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 16px;
    display: none;
  }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: #6B7686;
    margin-top: 20px;
  }
    </style>
    </head>
    <body>

    <div>
  <div class="card">
    <div class="card-inner">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.5 1.33 9.6 3.55 11.8L12 20.24l8.45-8.44c2.22-2.2 2.09-5.3.19-7.22Z"></path>
        </svg>
      </div>
      <h1>ACTIHUB</h1>
      <p class="subtitle">ระบบบันทึกกิจกรรม</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">อีเมล / ชื่อผู้ใช้</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 6-10 7L2 6"></path>
            </svg>
            <input type="text" id="email" placeholder="กรอกอีเมลหรือชื่อผู้ใช้" />
          </div>
        </div>

        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" class="pw" placeholder="กรอกรหัสผ่าน" />
            <button type="button" class="toggle-eye" id="toggleEye" aria-label="แสดงรหัสผ่าน">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" id="remember" />
            จดจำฉัน
          </label>
          <button type="button" class="forgot">ลืมรหัสผ่าน?</button>
        </div>

        <div class="notice" id="notice"></div>

        <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
      </form>

      <div class="divider">
        <div class="line"></div>
        <span>หรือ</span>
        <div class="line"></div>
      </div>

      <button type="button" class="btn-secondary" onclick="window.location.href='register.html'">สมัครสมาชิก</button>
    </div>

    <svg viewBox="0 0 400 90" style="width:100%; display:block; height:60px;" preserveAspectRatio="none">
      <path d="M0,60 C80,20 140,80 220,40 C290,10 340,50 400,25 L400,90 L0,90 Z" fill="#DCEBFF"></path>
      <path d="M0,75 C90,45 160,90 240,55 C310,28 350,65 400,50 L400,90 L0,90 Z" fill="#C6E6DC" opacity="0.8"></path>
    </svg>
  </div>

  <p class="footer-note">เทมเพลตสำหรับมูลนิธิ — ยังไม่มีข้อมูลจริง พร้อมให้ปรับแต่งและเชื่อมต่อระบบต่อได้</p>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword } from './firebase-init.js';
 
  const toggleEye = document.getElementById('toggleEye');
  const password = document.getElementById('password');
  toggleEye.addEventListener('click', () => {
    const isHidden = password.type === 'password';
    password.type = isHidden ? 'text' : 'password';
  });
 
  const form = document.getElementById('loginForm');
  const notice = document.getElementById('notice');
  const submitBtn = form.querySelector('button[type="submit"]');
 
  function showNotice(msg) {
    notice.textContent = msg;
    notice.style.display = 'block';
  }
 
  // แปล error code ของ Firebase Auth ให้เป็นข้อความไทยที่เข้าใจง่าย
  function translateAuthError(code) {
    switch (code) {
      case 'auth/invalid-email':
        return 'รูปแบบอีเมลไม่ถูกต้อง';
      case 'auth/user-not-found':
      case 'auth/invalid-credential':
        return 'ไม่พบบัญชีนี้ หรือรหัสผ่านไม่ถูกต้อง';
      case 'auth/wrong-password':
        return 'รหัสผ่านไม่ถูกต้อง';
      case 'auth/too-many-requests':
        return 'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่';
      default:
        return 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
    }
  }
 
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = password.value.trim();
 
    if (!email || !pass) {
      showNotice('กรอกอีเมล และรหัสผ่านให้ครบก่อนนะครับ');
      return;
    }
 
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';
 
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      // เข้าสู่ระบบสำเร็จ ไปหน้า Dashboard
      window.location.href = 'dashboard.html';
    } catch (err) {
      showNotice(translateAuthError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>
    
</body>
</html>
