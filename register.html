<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
 
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Noto Sans Thai', sans-serif;
      background: linear-gradient(180deg, #EAF3FF 0%, #F7FBFF 60%);
      color: #1F2937;
    }
 
    .card-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }
 
    .card {
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 20px 40px -12px rgba(30, 86, 216, 0.18);
      overflow: hidden;
    }
 
    .card-inner {
      padding: 40px 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
 
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2E6BF2, #1E56D8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
 
    .logo svg { width: 28px; height: 28px; }
 
    .main-title {
      text-align: center;
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      color: #10233F;
    }
 
    .subtitle {
      text-align: center;
      margin: 8px 0 28px;
      font-size: 0.95rem;
      color: #5B6B82;
    }
 
    form { width: 100%; }
 
    .field-name, .field-email, .field-password {
      margin-bottom: 18px;
      width: 100%;
      text-align: left;
    }
 
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
 
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid #D7E2F2;
      border-radius: 10px;
      background: #F8FAFD;
      padding: 0 12px;
      transition: border-color 0.15s ease;
    }
 
    .input-wrap:focus-within {
      border-color: #1E56D8;
      background: #FFFFFF;
    }
 
    .input-wrap svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: #8A99B3;
    }
 
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      padding: 12px 10px;
      font-size: 1rem;
      font-family: inherit;
      color: #10233F;
    }
 
    .input-wrap input::placeholder { color: #A8B4C7; }
 
    .toggle-eye {
      background: none;
      border: none;
      cursor: pointer;
      color: #8A99B3;
      display: flex;
      align-items: center;
      padding: 4px;
    }
 
    .toggle-eye:hover { color: #1E56D8; }
 
    .notice {
      display: none;
      font-size: 0.85rem;
      color: #B4530A;
      background: #FFF4E8;
      border: 1px solid #FBD9AF;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
 
    .btn-primary-register {
      width: 100%;
      text-align: center;
      background-color: #1E56D8;
      color: white;
      padding: 13px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      transition: background-color 0.15s ease;
    }
 
    .btn-primary-register:hover { background-color: #17469C; }
 
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 22px 0 16px;
      color: #A8B4C7;
      font-size: 0.85rem;
    }
 
    .divider .line {
      flex: 1;
      height: 1px;
      background: #E3EAF5;
    }
 
    .divider span { padding: 0 12px; }
 
    .btn-secondary {
      width: 100%;
      text-align: center;
      background-color: white;
      color: #1E56D8;
      padding: 12px 20px;
      border: 1px solid #C7D6F0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      transition: background-color 0.15s ease;
    }
 
    .btn-secondary:hover { background-color: #F1F6FF; }
 
    .wave { width: 100%; display: block; height: 60px; margin-top: 8px; }
 
    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: #8A99B3;
      margin-top: 20px;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
 
  <div class="card-container">
    <div class="card">
      <div class="card-inner">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.5 1.33 9.6 3.55 11.8L12 20.24l8.45-8.44c2.22-2.2 2.09-5.3.19-7.22Z"></path>
          </svg>
        </div>
        <h1 class="main-title">สมัครสมาชิก</h1>
        <p class="subtitle">สร้างบัญชีของคุณเพื่อเริ่มต้น</p>
 
        <form id="registerForm">
          <div class="field-name">
            <label for="name">ชื่อ-นามสกุล</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" />
            </div>
          </div>
 
          <div class="field-email">
            <label for="email">อีเมล</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 6-10 7L2 6"></path>
              </svg>
              <input type="email" id="email" placeholder="กรอกอีเมลของคุณ" />
            </div>
          </div>
 
          <div class="field-password">
            <label for="password">รหัสผ่าน</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="password" class="pw" placeholder="กรอกรหัสผ่านของคุณ" />
              <button type="button" class="toggle-eye" id="toggleEye" aria-label="แสดงรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
 
          <div class="notice" id="notice"></div>
 
          <button type="submit" class="btn-primary-register">สมัครสมาชิก</button>
        </form>
 
        <div class="divider">
          <div class="line"></div>
          <span>หรือ</span>
          <div class="line"></div>
        </div>
 
        <button type="button" class="btn-secondary" onclick="window.location.href='login.html'">เข้าสู่ระบบ</button>
      </div>
 
      <svg class="wave" viewBox="0 0 400 90" preserveAspectRatio="none">
        <path d="M0,60 C80,20 140,80 220,40 C290,10 340,50 400,25 L400,90 L0,90 Z" fill="#DCEBFF"></path>
        <path d="M0,75 C90,45 160,90 240,55 C310,28 350,65 400,50 L400,90 L0,90 Z" fill="#C6E6DC" opacity="0.8"></path>
      </svg>
    </div>
 
    <p class="footer-note">เทมเพลตสำหรับมูลนิธิ — ยังไม่มีข้อมูลจริง พร้อมให้ปรับแต่งและเชื่อมต่อระบบต่อได้</p>
  </div>
 
   <script type="module">
    import { auth, db, createUserWithEmailAndPassword, doc, setDoc, serverTimestamp } from './firebase-init.js';
 
    const toggleEye = document.getElementById('toggleEye');
    const password = document.getElementById('password');
    toggleEye.addEventListener('click', () => {
      const isHidden = password.type === 'password';
      password.type = isHidden ? 'text' : 'password';
    });
 
    const form = document.getElementById('registerForm');
    const notice = document.getElementById('notice');
    const submitBtn = form.querySelector('button[type="submit"]');
 
    function showNotice(msg) {
      notice.textContent = msg;
      notice.style.display = 'block';
    }
 
    // แปล error code ของ Firebase Auth ให้เป็นข้อความไทยที่เข้าใจง่าย
    function translateAuthError(code) {
      switch (code) {
        case 'auth/email-already-in-use':
          return 'อีเมลนี้มีบัญชีอยู่แล้ว ลองเข้าสู่ระบบแทนไหมคะ';
        case 'auth/invalid-email':
          return 'รูปแบบอีเมลไม่ถูกต้อง';
        case 'auth/weak-password':
          return 'รหัสผ่านสั้นเกินไป ต้องมีอย่างน้อย 6 ตัวอักษร';
        default:
          return 'สมัครสมาชิกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
      }
    }
 
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = password.value.trim();
 
      if (!name || !email || !pass) {
        showNotice('กรอกข้อมูลให้ครบก่อนนะครับ');
        return;
      }
      if (pass.length < 6) {
        showNotice('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
        return;
      }
 
      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังสมัครสมาชิก...';
 
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
 
        // สร้างข้อมูลโปรไฟล์ผู้ใช้ใน Firestore (collection "users", doc id = uid ของ Auth)
        await setDoc(doc(db, 'users', cred.user.uid), {
          name: name,
          email: email,
          role: 'user',
          totalHours: 0,
          targetHours: 60,
          createdAt: serverTimestamp(),
        });
 
        // สมัครสำเร็จ Firebase จะล็อกอินให้อัตโนมัติ พาไปหน้า Dashboard ได้เลย
        window.location.href = 'dashboard.html';
      } catch (err) {
        showNotice(translateAuthError(err.code));
        submitBtn.disabled = false;
        submitBtn.textContent = 'สมัครสมาชิก';
      }
    });
  </script>
</body>
</html>
