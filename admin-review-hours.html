<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจสอบชั่วโมง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans Thai', sans-serif;
    background: #F4F7FC;
    color: #1B2430;
    display: flex;
  }
 
  h1, h2, h3 { font-family: 'Kanit', sans-serif; margin: 0; }
 
  /* ---------- Admin sidebar ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #182238;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 24px; margin-bottom: 16px;
    border-bottom: 1px solid #2A3652;
  }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #2F6FED, #14A38A);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand .logo svg { width: 18px; height: 18px; }
  .brand span { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; color: #fff; }
  .brand .role-tag { font-size: 11px; color: #8AA0C8; margin-top: 2px; display: block; }
 
  nav.nav-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #A9B6D0; font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: #22304D; color: #fff; }
  .nav-item.active { background: #2F6FED; color: #fff; }
 
  .nav-logout {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #C88; font-size: 14px; font-weight: 500; cursor: pointer;
    border-top: 1px solid #2A3652; margin-top: 8px; padding-top: 16px;
  }
  .nav-logout svg { width: 18px; height: 18px; }
  .nav-logout:hover { color: #F08080; }
 
  /* ---------- Main ---------- */
  main { flex: 1; padding: 28px 36px 48px; max-width: 900px; }
 
  .topbar h2 { font-size: 22px; color: #1B2430; margin-bottom: 20px; }
 
  /* ---------- Filter tabs ---------- */
  .tab-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid #E3E8F0; background: #fff; color: #4B5768;
    white-space: nowrap;
  }
  .tab.active { background: #2F6FED; border-color: #2F6FED; color: #fff; }
 
  /* ---------- Review cards ---------- */
  .review-list { display: flex; flex-direction: column; gap: 14px; }
 
  .review-card {
    background: #fff; border: 1px solid #E3E8F0; border-radius: 16px;
    padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start;
  }
 
  .review-card img.evidence {
    width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
  }
 
  .review-body { flex: 1; min-width: 0; }
 
  .review-top-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
 
  .user-chip { display: flex; align-items: center; gap: 8px; }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #FBBF24, #F472B6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 11px; flex-shrink: 0;
  }
  .user-name { font-size: 13.5px; font-weight: 600; color: #1B2430; }
 
  .status-badge {
    font-size: 11.5px; font-weight: 600; padding: 4px 10px;
    border-radius: 999px; white-space: nowrap;
  }
  .status-badge.pending { background: #FFF4E0; color: #B4790A; }
  .status-badge.done { background: #E7F7F1; color: #14A38A; }
  .status-badge.rejected { background: #FDECEC; color: #D64545; }
 
  .activity-title { font-size: 14.5px; font-weight: 600; color: #1B2430; margin-bottom: 4px; }
 
  .review-meta {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: 12.5px; color: #6B7686; margin-bottom: 10px;
  }
  .review-meta span { display: flex; align-items: center; gap: 4px; }
  .review-meta svg { width: 13px; height: 13px; }
 
  .review-actions { display: flex; gap: 8px; }
 
  .btn-approve {
    display: flex; align-items: center; gap: 6px;
    background: #14A38A; color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .btn-approve svg { width: 14px; height: 14px; }
  .btn-approve:hover { background: #0E8271; }
 
  .btn-reject {
    display: flex; align-items: center; gap: 6px;
    background: #fff; color: #D64545; border: 1px solid #F3C6C6; border-radius: 8px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .btn-reject svg { width: 14px; height: 14px; }
  .btn-reject:hover { background: #FDECEC; }
 
  .review-card.decided { opacity: 0.7; }
 
  @media (max-width: 760px) {
    .sidebar { display: none; }
    main { padding: 20px; }
    .review-card { flex-wrap: wrap; }
  }
</style>
</head>
<body>
 
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.5 1.33 9.6 3.55 11.8L12 20.24l8.45-8.44c2.22-2.2 2.09-5.3.19-7.22Z"></path>
        </svg>
      </div>
      <div>
        <span>ACTIHUB</span>
        <span class="role-tag">แผงควบคุมแอดมิน</span>
      </div>
    </div>
 
    <nav class="nav-list">
      <a class="nav-item" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10h14V10"></path></svg>
        Dashboard
      </a>
      <a class="nav-item" href="admin-users.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        จัดการผู้ใช้
      </a>
      <a class="nav-item" href="post-activity.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        โพสต์งานอาสา
      </a>
      <a class="nav-item" href="manage-activities.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18M9 16h6"></path></svg>
        จัดการงานอาสา
      </a>
      <a class="nav-item active" href="admin-review-hours.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        ตรวจสอบชั่วโมง
      </a>
      <a class="nav-item" href="admin-reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg>
        รายงาน
      </a>
      <a class="nav-item" href="admin-settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
        ตั้งค่า
      </a>
    </nav>
 
    <div class="nav-logout" onclick="window.location.href='login.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      ออกจากระบบ
    </div>
  </aside>
 
  <main>
    <div class="topbar"><h2>ตรวจสอบชั่วโมงกิจกรรม</h2></div>
 
    <div class="tab-row">
      <div class="tab active">รอตรวจสอบ</div>
      <div class="tab">อนุมัติแล้ว</div>
      <div class="tab">ไม่อนุมัติ</div>
      <div class="tab">ทั้งหมด</div>
    </div>
 
    <div class="review-list" id="reviewList">
      <p style="color:#A8B4C7; font-size:13px;">กำลังโหลด...</p>
    </div>
  </main>
 
  <script type="module">
    import { auth, db, onAuthStateChanged, signOut, doc, getDoc, updateDoc, increment, collection, getDocs, orderBy, query } from './firebase-init.js';
 
    document.querySelector('.nav-logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });
 
    let allLogs = [];
    const userCache = {};
 
    async function getUserName(uid) {
      if (userCache[uid]) return userCache[uid];
      const snap = await getDoc(doc(db, 'users', uid));
      const name = snap.exists() ? (snap.data().name || uid) : uid;
      userCache[uid] = name;
      return name;
    }
 
    function initials(name) {
      return (name || '').trim().slice(0, 2) || '--';
    }
 
    async function renderLogs(filter) {
      const list = document.getElementById('reviewList');
      const filtered = filter === 'all' ? allLogs : allLogs.filter((l) => l.data.status === filter);
 
      if (!filtered.length) {
        list.innerHTML = '<p style="color:#A8B4C7; font-size:13px;">ไม่มีรายการ</p>';
        return;
      }
 
      const rows = await Promise.all(filtered.map(async ({ id, data: d }) => {
        const userName = await getUserName(d.userId);
        const statusMap = { pending: ['รอตรวจสอบ', 'pending'], done: ['อนุมัติแล้ว', 'done'], rejected: ['ไม่อนุมัติ', 'rejected'] };
        const [label, cls] = statusMap[d.status] || ['รอตรวจสอบ', 'pending'];
        const actionsHtml = d.status === 'pending' ? `
            <div class="review-actions">
              <button class="btn-approve" data-id="${id}" data-uid="${d.userId}" data-hours="${d.hours || 0}" data-action="done">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                อนุมัติ
              </button>
              <button class="btn-reject" data-id="${id}" data-action="rejected">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                ไม่อนุมัติ
              </button>
            </div>` : '';
 
        return `
          <div class="review-card ${d.status !== 'pending' ? 'decided' : ''}" data-id="${id}">
            <img class="evidence" src="${d.photoUrl || 'https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=150&h=150&fit=crop'}" alt="หลักฐาน">
            <div class="review-body">
              <div class="review-top-row">
                <div class="user-chip">
                  <div class="user-avatar">${initials(userName)}</div>
                  <span class="user-name">${userName}</span>
                </div>
                <span class="status-badge ${cls}">${label}</span>
              </div>
              <div class="activity-title">${d.activityName || '-'}</div>
              <div class="review-meta">
                <span>${d.date || '-'}</span>
                <span>ขอ ${d.hours || 0} ชม.</span>
              </div>
              ${actionsHtml}
            </div>
          </div>`;
      }));
 
      list.innerHTML = rows.join('');
 
      list.querySelectorAll('.btn-approve, .btn-reject').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const logId = btn.dataset.id;
          const action = btn.dataset.action;
          btn.disabled = true;
          try {
            await updateDoc(doc(db, 'hourLogs', logId), { status: action });
            if (action === 'done') {
              const uid = btn.dataset.uid;
              const hours = parseFloat(btn.dataset.hours) || 0;
              await updateDoc(doc(db, 'users', uid), { totalHours: increment(hours) });
            }
            const idx = allLogs.findIndex((l) => l.id === logId);
            if (idx !== -1) allLogs[idx].data.status = action;
            const activeTab = document.querySelector('.tab.active');
            const filters = ['pending', 'done', 'rejected', 'all'];
            const tabIndex = Array.from(document.querySelectorAll('.tab')).indexOf(activeTab);
            renderLogs(filters[tabIndex] ?? 'pending');
          } catch (err) {
            alert('ทำรายการไม่สำเร็จ: ' + err.message);
            console.error(err);
            btn.disabled = false;
          }
        });
      });
    }
 
    document.querySelectorAll('.tab').forEach((tab, i) => {
      const filters = ['pending', 'done', 'rejected', 'all'];
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        renderLogs(filters[i]);
      });
    });
 
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const role = userSnap.exists() ? userSnap.data().role : 'user';
      if (role !== 'admin') {
        alert('หน้านี้สำหรับแอดมินเท่านั้น');
        window.location.href = 'dashboard.html';
        return;
      }
 
      try {
        const q = query(collection(db, 'hourLogs'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        allLogs = snap.docs.map((d) => ({ id: d.id, data: d.data() }));
        renderLogs('pending');
      } catch (err) {
        document.getElementById('reviewList').innerHTML =
          '<p style="color:#D64545; font-size:13px;">โหลดข้อมูลไม่สำเร็จ</p>';
        console.error(err);
      }
    });
  </script>
 
</body>
</html>
