<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รับงานอาสา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans Thai', sans-serif;
    background: #F4F7FC;
    color: #1B2430;
    display: flex;
  }
 
  h1, h2, h3 { font-family: 'Kanit', sans-serif; margin: 0; }
 
  /* ---------- Sidebar (shared) ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #E3E8F0;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    height: 100vh;
    position: sticky;
    top: 0;
  }
 
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 24px;
    margin-bottom: 16px;
    border-bottom: 1px solid #EEF2F8;
  }
 
  .brand .logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2F6FED, #14A38A);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
 
  .brand .logo svg { width: 18px; height: 18px; }
  .brand span { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; color: #1B2430; }
 
  nav.nav-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
 
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #4B5768; font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer;
  }
 
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: #F0F5FF; color: #2F6FED; }
  .nav-item.active { background: #2F6FED; color: #fff; }
 
  .nav-logout {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #8A5A5A; font-size: 14px; font-weight: 500; cursor: pointer;
    border-top: 1px solid #EEF2F8; margin-top: 8px; padding-top: 16px;
  }
  .nav-logout svg { width: 18px; height: 18px; }
  .nav-logout:hover { color: #D64545; }
 
  /* ---------- Main ---------- */
  main { flex: 1; padding: 28px 36px 48px; max-width: 1100px; }
 
  .topbar { margin-bottom: 22px; }
  .topbar h2 { font-size: 22px; color: #1B2430; }
 
  /* ---------- Search + filter button ---------- */
  .search-row { display: flex; gap: 12px; margin-bottom: 16px; }
 
  .search-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #E3E8F0;
    border-radius: 12px;
    padding: 0 14px;
  }
  .search-box svg { width: 18px; height: 18px; color: #8A99B3; flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    padding: 12px 0; font-size: 14px; font-family: inherit; color: #1B2430;
  }
  .search-box input::placeholder { color: #A8B4C7; }
 
  .filter-btn {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #E3E8F0; border-radius: 12px;
    padding: 0 16px; font-size: 14px; font-weight: 500; color: #4B5768;
    cursor: pointer; white-space: nowrap;
  }
  .filter-btn svg { width: 16px; height: 16px; }
 
  /* ---------- Category pills ---------- */
  .pill-row {
    display: flex; gap: 8px; margin-bottom: 22px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .pill {
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500;
    white-space: nowrap; cursor: pointer; border: 1px solid #E3E8F0; background: #fff; color: #4B5768;
  }
  .pill.active { background: #2F6FED; border-color: #2F6FED; color: #fff; }
 
  /* ---------- Activity cards ---------- */
  .activity-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
 
  .activity-card {
    display: flex; gap: 16px;
    background: #fff; border: 1px solid #E3E8F0; border-radius: 16px;
    padding: 14px; align-items: center;
  }
 
  .activity-card img {
    width: 84px; height: 84px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
  }
 
  .activity-body { flex: 1; min-width: 0; }
  .activity-title { font-size: 15px; font-weight: 600; color: #1B2430; margin-bottom: 4px; }
  .activity-org { font-size: 13px; color: #2F6FED; font-weight: 500; margin-bottom: 6px; }
  .activity-meta {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: 12.5px; color: #6B7686;
  }
  .activity-meta span { display: flex; align-items: center; gap: 4px; }
  .activity-meta svg { width: 13px; height: 13px; }
 
  .activity-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
  .spots-left { font-size: 12px; color: #B4790A; background: #FFF4E0; padding: 4px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
 
  .btn-detail {
    background: #2F6FED; color: #fff; border: none; border-radius: 10px;
    padding: 9px 18px; font-size: 13px; font-weight: 500; font-family: inherit;
    cursor: pointer; white-space: nowrap;
  }
  .btn-detail:hover { background: #1F4FC4; }
 
  /* ---------- Pagination ---------- */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .page-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid #E3E8F0;
    background: #fff; color: #4B5768; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .page-btn.active { background: #2F6FED; border-color: #2F6FED; color: #fff; }
  .page-btn svg { width: 15px; height: 15px; }
 
  @media (max-width: 760px) {
    .sidebar { display: none; }
    main { padding: 20px; }
    .activity-card { flex-wrap: wrap; }
    .activity-side { flex-direction: row; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
 
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.5 1.33 9.6 3.55 11.8L12 20.24l8.45-8.44c2.22-2.2 2.09-5.3.19-7.22Z"></path>
        </svg>
      </div>
      <span id="brandName">ชื่อโครงการ</span>
    </div>
 
    <nav class="nav-list">
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10h14V10"></path></svg>
        หน้าหลัก
      </a>
      <a class="nav-item active" href="browse-activities.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        รับงานอาสา
      </a>
      <a class="nav-item" href="log-hours.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path><path d="M12 8v4l3 2"></path></svg>
        บันทึกชั่วโมง
      </a>
      <a class="nav-item" href="hour-history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"></path><path d="M3.05 13a9 9 0 1 0 .5-4.5L3 8"></path><path d="M12 7v5l3 3"></path></svg>
        ประวัติชั่วโมง
      </a>
      <a class="nav-item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        โปรไฟล์
      </a>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
        ตั้งค่า
      </a>
      <a class="nav-item" id="adminLink" href="admin-review-hours.html" style="display:none; color:#B4790A;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 9 9 10 5.2-1 9-5 9-10V6l-9-4Z"></path></svg>
        แผงควบคุมแอดมิน
      </a>
    </nav>
 
    <div class="nav-logout" onclick="window.location.href='login.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
      ออกจากระบบ
    </div>
  </aside>
 
  <main>
    <div class="topbar">
      <h2>รับงานอาสา</h2>
    </div>
 
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" placeholder="ค้นหางานอาสา, สถานที่, ประเภทกิจกรรม...">
      </div>
      <button class="filter-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        ตัวกรอง
      </button>
    </div>
 
    <div class="pill-row" id="pillRow">
      <div class="pill active" data-cat="all">ทั้งหมด</div>
    </div>
 
    <div class="activity-grid" id="activityGrid">
      <p style="color:#A8B4C7; font-size:13px;">กำลังโหลด...</p>
    </div>
 
    <div class="pagination" id="pagination" style="display:none;">
      <button class="page-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button class="page-btn active">1</button>
      <button class="page-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
  </main>
 
  <script type="module">
    import { auth, db, onAuthStateChanged, signOut, doc, getDoc, collection, getDocs, orderBy, query } from './firebase-init.js';
 
    // โหลดชื่อหน่วยงานจากส่วนกลาง (settings/general) มาแสดงในแถบเมนู/หัวข้อ
    (async () => {
      try {
        const s = await getDoc(doc(db, 'settings', 'general'));
        if (s.exists() && s.data().orgName) {
          document.querySelectorAll('#brandName').forEach((el) => { el.textContent = s.data().orgName; });
        }
      } catch (e) { /* ใช้ชื่อค่าเริ่มต้นถ้าโหลดไม่สำเร็จ */ }
    })();
 
    document.querySelector('.nav-logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });
 
    let allActivities = [];
 
    function renderGrid(filterCat) {
      const grid = document.getElementById('activityGrid');
      const list = filterCat === 'all' ? allActivities : allActivities.filter((a) => a.type === filterCat);
 
      if (!list.length) {
        grid.innerHTML = '<p style="color:#A8B4C7; font-size:13px;">ไม่มีงานอาสาในหมวดหมู่นี้</p>';
        return;
      }
 
      grid.innerHTML = list.map((a) => `
        <div class="activity-card">
          <img src="${a.imageUrl || 'https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=200&h=200&fit=crop'}" alt="">
          <div class="activity-body">
            <div class="activity-title">${a.name || '-'}</div>
            <div class="activity-org">${a.place || ''}</div>
            <div class="activity-meta">
              <span>${a.date || '-'}</span>
              <span>${a.time || ''}</span>
              <span>${a.hours || 0} ชม.</span>
            </div>
          </div>
          <div class="activity-side">
            <span class="spots-left">รับ ${a.spots || 0} คน / มีผู้จอง ${a.applicants || 0} คน</span>
            <button class="btn-detail" onclick="window.location.href='activity-detail.html?id=${a.id}'">ดูรายละเอียด</button>
          </div>
        </div>`).join('');
    }
 
    async function loadCategoriesAndPills() {
      const pillRow = document.getElementById('pillRow');
      try {
        const s = await getDoc(doc(db, 'settings', 'general'));
        const categories = (s.exists() && s.data().categories) || ['สิ่งแวดล้อม', 'ผู้สูงอายุ', 'การศึกษา', 'อื่นๆ'];
 
        pillRow.innerHTML = `<div class="pill active" data-cat="all">ทั้งหมด</div>` +
          categories.map((c) => `<div class="pill" data-cat="${c}">${c}</div>`).join('');
 
        pillRow.querySelectorAll('.pill').forEach((pill) => {
          pill.addEventListener('click', () => {
            pillRow.querySelectorAll('.pill').forEach((p) => p.classList.remove('active'));
            pill.classList.add('active');
            renderGrid(pill.dataset.cat);
          });
        });
      } catch (err) {
        console.error(err);
      }
    }
 
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
 
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      if (userSnap.exists() && userSnap.data().role === 'admin') {
        document.getElementById('adminLink').style.display = 'flex';
      }
 
      loadCategoriesAndPills();
 
      const grid = document.getElementById('activityGrid');
      try {
        const q = query(collection(db, 'activities'), orderBy('date', 'asc'));
        const snap = await getDocs(q);
 
        if (snap.empty) {
          grid.innerHTML = '<p style="color:#A8B4C7; font-size:13px;">ยังไม่มีงานอาสาที่เปิดรับตอนนี้</p>';
          return;
        }
 
        allActivities = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderGrid('all');
      } catch (err) {
        grid.innerHTML = '<p style="color:#D64545; font-size:13px;">โหลดข้อมูลไม่สำเร็จ</p>';
        console.error(err);
      }
    });
  </script>
 
</body>
</html>
