<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดงานอาสา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans Thai', sans-serif;
    background: #F4F7FC;
    color: #1B2430;
    display: flex;
    justify-content: center;
  }
 
  h1, h2, h3 { font-family: 'Kanit', sans-serif; margin: 0; }
 
  .page {
    width: 100%;
    max-width: 640px;
    padding: 24px 20px 60px;
  }
 
  /* ---------- Top bar ---------- */
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
 
  .back-link {
    display: flex; align-items: center; gap: 6px;
    color: #4B5768; font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer;
  }
  .back-link svg { width: 18px; height: 18px; }
  .back-link:hover { color: #2F6FED; }
 
  .share-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid #E3E8F0; background: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #4B5768;
  }
  .share-btn svg { width: 17px; height: 17px; }
 
  /* ---------- Hero ---------- */
  .hero {
    width: 100%;
    height: 230px;
    border-radius: 18px;
    object-fit: cover;
    margin-bottom: 18px;
    display: block;
  }
 
  .detail-title { font-size: 21px; font-weight: 700; color: #1B2430; margin-bottom: 14px; }
 
  /* ---------- Meta card ---------- */
  .meta-card {
    background: #fff;
    border: 1px solid #E3E8F0;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
 
  .meta-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: #4B5768; }
  .meta-row svg { width: 17px; height: 17px; color: #2F6FED; flex-shrink: 0; }
 
  /* ---------- Section ---------- */
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 15px; color: #1B2430; margin-bottom: 10px; }
  .section p { font-size: 14px; line-height: 1.7; color: #4B5768; margin: 0; }
 
  .tag-list { display: flex; flex-direction: column; gap: 10px; }
 
  .tag-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: #1B2430;
  }
  .tag-row .icon-circle {
    width: 30px; height: 30px; border-radius: 8px;
    background: #EEF2F8; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tag-row .icon-circle svg { width: 15px; height: 15px; color: #2F6FED; }
 
  .check-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: #1B2430;
  }
  .check-row svg { width: 17px; height: 17px; color: #14A38A; flex-shrink: 0; }
 
  /* ---------- CTA ---------- */
  .btn-apply {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2F6FED;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-apply:hover { background: #1F4FC4; }
 
  @media (max-width: 480px) {
    .hero { height: 180px; }
  }
</style>
</head>
<body>
 
  <div class="page">
    <div class="top-row">
      <a class="back-link" onclick="window.location.href='browse-activities.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        กลับ
      </a>
      <button class="share-btn" aria-label="แชร์">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg>
      </button>
    </div>
 
    <img class="hero" id="heroImg" src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=800&h=500&fit=crop" alt="">
 
    <h1 class="detail-title" id="detailTitle">กำลังโหลด...</h1>
 
    <div class="meta-card">
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <span id="metaDate">--</span>
      </div>
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span id="metaTime">--</span>
      </div>
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span id="metaPlace">--</span>
      </div>
      <div class="meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span id="metaSpots">--</span>
      </div>
    </div>
 
    <div class="section">
      <h3>รายละเอียดงาน</h3>
      <p id="detailDesc">กำลังโหลด...</p>
    </div>
 
    <div class="section">
      <h3>สิ่งที่ได้รับ</h3>
      <div class="tag-list">
        <div class="tag-row">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"></path><path d="M12 8v4l3 2"></path></svg>
          </div>
          <span id="metaHoursBenefit">ชั่วโมงอาสา -- ชั่วโมง</span>
        </div>
      </div>
    </div>
 
    <button class="btn-apply" id="applyBtn">สมัครเข้าร่วมงานอาสา</button>
  </div>
 
  <script type="module">
    import { auth, db, onAuthStateChanged, doc, getDoc, addDoc, updateDoc, collection, query, where, getDocs, increment, serverTimestamp } from './firebase-init.js';
 
    const params = new URLSearchParams(window.location.search);
    const activityId = params.get('id');
    const applyBtn = document.getElementById('applyBtn');
 
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
 
      if (!activityId) {
        document.getElementById('detailTitle').textContent = 'ไม่พบกิจกรรมนี้';
        applyBtn.style.display = 'none';
        return;
      }
 
      try {
        const snap = await getDoc(doc(db, 'activities', activityId));
        if (!snap.exists()) {
          document.getElementById('detailTitle').textContent = 'ไม่พบกิจกรรมนี้';
          applyBtn.style.display = 'none';
          return;
        }
        const a = snap.data();
 
        document.getElementById('detailTitle').textContent = a.name || '-';
        document.getElementById('metaDate').textContent = a.date || '-';
        document.getElementById('metaTime').textContent = a.time || '-';
        document.getElementById('metaPlace').textContent = a.place || '-';
        document.getElementById('metaSpots').textContent = `รับ ${a.spots || 0} คน / มีผู้จอง ${a.applicants || 0} คน`;
        document.getElementById('detailDesc').textContent = a.description || 'ไม่มีรายละเอียดเพิ่มเติม';
        document.getElementById('metaHoursBenefit').textContent = `ชั่วโมงอาสา ${a.hours || 0} ชั่วโมง`;
        if (a.imageUrl) document.getElementById('heroImg').src = a.imageUrl;
 
        // เช็คว่า user คนนี้เคยสมัครกิจกรรมนี้ไว้แล้วหรือยัง
        const regQuery = query(
          collection(db, 'registrations'),
          where('activityId', '==', activityId),
          where('userId', '==', user.uid)
        );
        const regSnap = await getDocs(regQuery);
 
        function setLogHoursMode() {
          applyBtn.textContent = 'บันทึกชั่วโมง';
          applyBtn.onclick = () => {
            window.location.href = `log-hours.html?activityId=${activityId}&activityName=${encodeURIComponent(a.name || '')}`;
          };
        }
 
        if (!regSnap.empty) {
          // สมัครไว้แล้ว → ปุ่มพาไปบันทึกชั่วโมงได้เลย
          setLogHoursMode();
        } else {
          // ยังไม่เคยสมัคร → ปุ่มสำหรับสมัครเข้าร่วมก่อน
          applyBtn.textContent = 'สมัครเข้าร่วมงานอาสา';
          applyBtn.onclick = async () => {
            applyBtn.disabled = true;
            applyBtn.textContent = 'กำลังสมัคร...';
            try {
              await addDoc(collection(db, 'registrations'), {
                activityId,
                activityName: a.name || '',
                userId: user.uid,
                status: 'registered',
                createdAt: serverTimestamp(),
              });
              // อัปเดตจำนวนผู้จองในโพสต์กิจกรรม (แก้ได้แค่ field นี้ตาม Security Rules)
              await updateDoc(doc(db, 'activities', activityId), { applicants: increment(1) });
 
              const newApplicants = (a.applicants || 0) + 1;
              document.getElementById('metaSpots').textContent = `รับ ${a.spots || 0} คน / มีผู้จอง ${newApplicants} คน`;
 
              alert('สมัครเข้าร่วมสำเร็จ! หลังทำกิจกรรมเสร็จ กลับมาที่หน้านี้เพื่อบันทึกชั่วโมงได้เลย');
              applyBtn.disabled = false;
              setLogHoursMode();
            } catch (err) {
              alert('สมัครไม่สำเร็จ: ' + err.message);
              applyBtn.disabled = false;
              applyBtn.textContent = 'สมัครเข้าร่วมงานอาสา';
              console.error(err);
            }
          };
        }
      } catch (err) {
        document.getElementById('detailTitle').textContent = 'โหลดข้อมูลไม่สำเร็จ';
        console.error(err);
      }
    });
  </script>
 
</body>
</html>
